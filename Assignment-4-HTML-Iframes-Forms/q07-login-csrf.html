<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7 - Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form action="#" method="post">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>

        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password" required>
        <br><br>

        <!-- A CSRF token helps a server verify that a submitted request came from an authorized page, reducing cross-site request forgery. -->
        <!-- This dummy value is for demonstration only; a real token must be generated and verified by the server. -->
        <input type="hidden" name="csrf_token" value="dummy-csrf-token-123">
        <button type="submit">Log In</button>
    </form>
</body>
</html>
