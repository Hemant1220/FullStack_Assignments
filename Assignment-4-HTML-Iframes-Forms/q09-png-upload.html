<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - File Upload</title>
</head>
<body>
    <h1>Upload a File</h1>
    <p>Only PNG image files (.png) are allowed.</p>
    <form action="#" method="post" enctype="multipart/form-data">
        <label for="image-file">Choose a PNG file:</label>
        <input type="file" id="image-file" name="imageFile" accept=".png,image/png" required>
        <br><br>
        <button type="submit">Upload File</button>
    </form>
</body>
</html>
