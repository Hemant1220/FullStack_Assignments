<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - Google Map</title>
</head>
<body>
    <h1>Map of Mathura</h1>
    <iframe
        title="Google Map showing Mathura"
        src="https://maps.google.com/maps?q=Mathura%2C%20Uttar%20Pradesh%2C%20India&output=embed"
        width="100%"
        height="450"
        loading="lazy">
    </iframe>
    <!-- loading="lazy" lets the browser defer loading the map until it is near the visible area. -->
</body>
</html>
