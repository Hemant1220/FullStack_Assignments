<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 19 - Form Security Attributes</title>
</head>
<body>
    <h1>Form Security Attributes</h1>
    <form action="#" method="post" autocomplete="off">
        <label for="secure-username">Username:</label>
        <input type="text" id="secure-username" name="username" required>
        <br><br>
        <label for="secure-email">Email:</label>
        <input type="email" id="secure-email" name="email" required>
        <br><br>
        <label for="secure-password">Password:</label>
        <input type="password" id="secure-password" name="password" required>
        <br><br>
        <button type="submit">Submit</button>
    </form>
    <p>Turning off autocomplete can reduce the chance that a browser will suggest or automatically fill saved information on a shared device. It does not replace server-side security measures.</p>
</body>
</html>
