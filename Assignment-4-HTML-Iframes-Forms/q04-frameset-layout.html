<html>
<head>
    <title>Question 4 - Frameset Layout</title>
</head>
<frameset rows="25%,75%">

    <frame src="q04-welcome.html" name="content" title="Welcome message">
    <noframes>
        <body>Your browser does not support frames.</body>
    </noframes>
</frameset>
</html>
