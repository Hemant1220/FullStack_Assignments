<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title sets the text shown in the browser tab. -->
    <title>Question 20 - Important Head Elements</title>
    <!-- meta charset declares the character encoding used by the document. -->
    <meta charset="UTF-8">
    <!-- meta description provides a short summary for search engines. -->
    <meta name="description" content="An example page demonstrating important HTML head elements.">
    <!-- meta author identifies the author of this document. -->
    <meta name="author" content="Hemant">
    <!-- base sets the base URL used by relative links on this page. -->
    <base href="https://example.com/">
    <!-- link can reference a favicon or another external resource. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- The style element holds CSS; kept empty for this HTML-only assignment. -->
    <style></style>
    <!-- The script element holds JavaScript; kept empty for this HTML-only assignment. -->
    <script></script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page includes the requested head elements with comments explaining their purposes.</p>
    <a href="about">Example relative link using the base URL</a>
</body>
</html>
