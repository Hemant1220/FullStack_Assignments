<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 17 - Submit Form</title>
</head>
<body>
    <h1>Simple Form</h1>
    <!-- The target attribute loads the response page in the iframe below. -->
    <form action="q17-result.html" method="get" target="resultFrame">
        <label for="form-text">Enter text:</label>
        <input type="text" id="form-text" name="text" required>
        <button type="submit">Submit</button>
    </form>
    <h2>Result</h2>
    <iframe src="q17-result.html" name="resultFrame" title="Form submission result" width="100%" height="120"></iframe>
</body>
</html>
