    <title>Question 16 - URI Encoding</title>
</head>
<body>
    <h1>URI Encoding</h1>
    <p>In a URL query value, a space can be encoded as %20 and an ampersand separating query parameters should be encoded as %26 when it is part of the value.</p>
    <p>Example encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">Search for HTML &amp; CSS</a>
    <p>Encoded URL: https://example.com/search?query=HTML%20%26%20CSS</p>
</body>
</html>
