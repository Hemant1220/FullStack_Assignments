<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Places — Responsive Photo Gallery</title>
    <link rel="stylesheet" href="responsive-photo-gallery-grid.css">
</head>
<body>
    <header class="page-header">
        <p class="eyebrow">A VISUAL JOURNAL</p>
        <h1>Quiet Places</h1>
        <p>Landscapes, light, and a few moments of calm.</p>
    </header>

    <main>
        <section class="photo-grid" aria-label="Responsive photo gallery">
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Mountain peaks reflected in a lake"></div><figcaption><strong>Still Waters</strong><span>Alpine reflections</span></figcaption></figure>
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Sunlight streaming through a forest"></div><figcaption><strong>Forest Light</strong><span>A quiet path</span></figcaption></figure>
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Open field with distant hills"></div><figcaption><strong>Open Country</strong><span>Room to wander</span></figcaption></figure>
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Mountain lake with blue water"></div><figcaption><strong>Blue Horizon</strong><span>Beyond the ridge</span></figcaption></figure>
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Warm light over a field at sunrise"></div><figcaption><strong>First Light</strong><span>A new beginning</span></figcaption></figure>
            <figure class="photo-card"><div class="image-wrap"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="High mountain peaks beneath a cloudy sky"></div><figcaption><strong>High Country</strong><span>Above the clouds</span></figcaption></figure>
        </section>
    </main>

    <footer><p>Hover over a photo to zoom in. Images are loaded from Unsplash.</p></footer>
</body>
</html>
