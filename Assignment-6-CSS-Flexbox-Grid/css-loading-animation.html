<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loading Animation</title>
    <link rel="stylesheet" href="css-loading-animation.css">
</head>
<body>
    <main class="loading-page">
        <section class="loader-card" aria-label="Loading animation demonstration">
            <p class="eyebrow">PURE CSS ANIMATION</p>
            <h1>One moment, please</h1>
            <p>Three circles move up and down with staggered animation delays.</p>
            <div class="loader" role="img" aria-label="Three animated loading dots">
                <div class="dot dot-one"></div>
                <div class="dot dot-two"></div>
                <div class="dot dot-three"></div>
            </div>
            <p class="loader-label">Loading sample content…</p>
        </section>
    </main>
</body>
</html>
