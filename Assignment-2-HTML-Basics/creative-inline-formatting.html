<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <h1>A Small Reminder</h1>
    <p>
        <strong>Keep learning</strong>, even when a topic feels difficult.
        <br>
        Take a <em>short break</em>, notice what you have <mark>already achieved</mark>,
        and continue one step at a time.
        <br>
        <small>Progress takes patience and consistent practice.</small>
    </p>
</body>
</html>
