<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Link in a New Tab</title>
</head>
<body>
    <h1>A Useful Search Link</h1>
    <p>Use the link below to open Google in a new browser tab.</p>
    <!-- target="_blank" requests a new tab/window; rel improves link security. -->
    <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">Visit Google</a>
</body>
</html>
