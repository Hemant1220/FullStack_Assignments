<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Links Example</title>
</head>
<body>
    <header>
        <h1>My Personal Website</h1>
    </header>
    <!-- The nav element groups links used to move around a website. -->
    <nav aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</body>
</html>
