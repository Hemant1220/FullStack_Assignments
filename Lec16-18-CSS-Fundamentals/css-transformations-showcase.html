<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CSS Transformations Showcase</title><link rel="stylesheet" href="css-transformations-showcase.css"></head>
<body><header><p class="eyebrow">TRANSFORM YOUR VIEW</p><h1>Four transformations</h1><p>Hover over a tile to see how CSS can change its position, size, or angle.</p></header>
<main class="transforms"><figure><div class="tile rotate">↻</div><figcaption><h2>rotate()</h2><p>Turns the element around its center.</p></figcaption></figure><figure><div class="tile scale">＋</div><figcaption><h2>scale()</h2><p>Grows the element without changing its flow space.</p></figcaption></figure><figure><div class="tile translate">→</div><figcaption><h2>translate()</h2><p>Moves the element along the X and Y axes.</p></figcaption></figure><figure><div class="tile skew">◇</div><figcaption><h2>skew()</h2><p>Slants the element along an axis.</p></figcaption></figure></main>
<footer>Each tile uses a smooth 0.4-second transition.</footer></body></html>
