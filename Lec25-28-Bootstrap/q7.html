<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="q7.css"></head>
<body><main class="container py-5"><div class="task-panel mx-auto"><header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="text-primary fw-bold text-uppercase small mb-1">My workspace</p><h1 class="h2 fw-bold mb-0">Task tracker <span class="badge rounded-pill text-bg-primary align-middle">3 pending</span></h1></div><button class="btn btn-outline-secondary" type="button">Filter tasks</button></header>
<ul class="list-group shadow-sm"><li class="list-group-item d-flex justify-content-between align-items-center py-3"><div><strong>Finish Bootstrap assignment</strong><div class="small text-secondary">Due today · Coursework</div></div><span class="badge text-bg-danger rounded-pill">High</span></li><li class="list-group-item d-flex justify-content-between align-items-center py-3"><div><strong>Review Java notes</strong><div class="small text-secondary">Due tomorrow · Study</div></div><span class="badge text-bg-warning rounded-pill">Medium</span></li><li class="list-group-item d-flex justify-content-between align-items-center py-3"><div><strong>Organize project files</strong><div class="small text-secondary">This week · Personal</div></div><span class="badge text-bg-success rounded-pill">Low</span></li></ul>
<section class="mt-4 p-4 bg-light rounded-3 d-flex flex-wrap justify-content-between align-items-center gap-3"><div><h2 class="h5 fw-bold mb-1">Completed tasks</h2><p class="text-secondary mb-0">You have finished 4 tasks this week.</p></div><button class="btn btn-success" type="button">Completed <span class="badge text-bg-light text-success ms-1">4</span></button></section>
</div></main></body></html>
