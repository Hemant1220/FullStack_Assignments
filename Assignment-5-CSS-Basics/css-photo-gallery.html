<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery — Quiet Places</title>
    <link rel="stylesheet" href="css-photo-gallery.css">
</head>
<body>
    <header class="gallery-header">
        <p class="eyebrow">A VISUAL JOURNAL</p>
        <h1>Quiet Places</h1>
        <p>A small collection of landscapes, light, and places to pause.</p>
    </header>

    <main>
        <section class="gallery" aria-label="Photo gallery">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Mountain lake reflecting the landscape">
                <figcaption><strong>Still Waters</strong><span>Alpine lake</span></figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Sunlight filtering through a green forest">
                <figcaption><strong>Forest Light</strong><span>Woodland path</span></figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Open countryside stretching toward distant hills">
                <figcaption><strong>Open Country</strong><span>Wide horizons</span></figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Blue mountain lake surrounded by peaks">
                <figcaption><strong>Blue Horizon</strong><span>Mountain view</span></figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Warm sunrise above a peaceful field">
                <figcaption><strong>First Light</strong><span>Early morning</span></figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&amp;fit=crop&amp;w=900&amp;q=85" alt="Dramatic mountain peaks beneath a cloudy sky">
                <figcaption><strong>High Country</strong><span>Mountain range</span></figcaption>
            </figure>
        </section>
    </main>

    <footer><p>Hover over an image to reveal its caption. Images are loaded from Unsplash.</p></footer>
</body>
</html>
