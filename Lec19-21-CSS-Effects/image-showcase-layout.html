<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Showcase Layout</title><link rel="stylesheet" href="image-showcase-layout.css"></head>
<body><header><p class="eyebrow">PLACES TO PAUSE</p><h1>A little visual escape</h1><p>Six scenes that remind us to look a little closer.</p></header>

<figure><div class="photo"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Blue lake surrounded by mountains"><span class="overlay" aria-hidden="true"></span></div><figcaption>Blue horizon</figcaption></figure>
<figure><div class="photo"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Warm sunrise over a field"><span class="overlay" aria-hidden="true"></span></div><figcaption>First light</figcaption></figure>
<figure><div class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800" alt="Dramatic mountain peaks"><span class="overlay" aria-hidden="true"></span></div><figcaption>High country</figcaption></figure>
</main><footer>Hover over a photograph to explore its details.</footer></body></html>
